# Disposable test infrastructure; independent from the application compose file.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: howmuch_test
      POSTGRES_USER: howmuch_test
      POSTGRES_PASSWORD: howmuch_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U howmuch_test -d howmuch_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
