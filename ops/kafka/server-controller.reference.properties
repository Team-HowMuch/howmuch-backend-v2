# Use unique node IDs 1, 2, 3 on separate controller failure domains.
process.roles=controller
node.id=REPLACE_CONTROLLER_ID
controller.quorum.voters=1@REPLACE_CONTROLLER_1_DNS:9093,2@REPLACE_CONTROLLER_2_DNS:9093,3@REPLACE_CONTROLLER_3_DNS:9093
listeners=CONTROLLER://:9093
listener.security.protocol.map=BROKER:SSL,CONTROLLER:SSL
controller.listener.names=CONTROLLER
inter.broker.listener.name=BROKER
log.dirs=/var/lib/kafka/data
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/private/node.keystore.p12
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/private/cluster.truststore.p12
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
ssl.keystore.password=${file:/run/secrets/kafka/passwords.properties:keystore.password}
ssl.key.password=${file:/run/secrets/kafka/passwords.properties:key.password}
ssl.truststore.password=${file:/run/secrets/kafka/passwords.properties:truststore.password}
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:CN=kafka-controller-1;User:CN=kafka-controller-2;User:CN=kafka-controller-3;User:CN=kafka-broker-1;User:CN=kafka-broker-2;User:CN=kafka-broker-3;User:CN=kafka-admin
