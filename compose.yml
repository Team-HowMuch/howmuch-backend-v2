services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be a digest-pinned image reference}
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GROUP_IMAGE_STORAGE_DIR: /app/uploads/group-images
      PROFILE_IMAGE_STORAGE_DIR: /app/uploads/profile-images
      LOG_FILE: /app/logs/howmuch-backend-v2.log
    volumes:
      - group_images:/app/uploads/group-images
      - ${PROFILE_IMAGE_HOST_DIR:-./uploads/profile-images}:/app/uploads/profile-images
      - ${LOG_HOST_DIR:-./logs}:/app/logs
    restart: unless-stopped

volumes:
  group_images:
