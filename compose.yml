services:
  app:
    image: ghcr.io/team-howmuch/howmuch-backend-v2:${IMAGE_TAG}
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GROUP_IMAGE_STORAGE_DIR: /app/uploads/group-images
      PROFILE_IMAGE_STORAGE_DIR: /app/uploads/profile-images
    volumes:
      - group_images:/app/uploads/group-images
      - ${PROFILE_IMAGE_HOST_DIR:-./uploads/profile-images}:/app/uploads/profile-images
    restart: unless-stopped

volumes:
  group_images:
