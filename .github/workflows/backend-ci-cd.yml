name: Backend CI/CD

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run tests
    runs-on: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: howmuch_test
          POSTGRES_USER: howmuch_test
          POSTGRES_PASSWORD: howmuch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howmuch_test -d howmuch_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/howmuch_test
      DB_USERNAME: howmuch_test
      DB_PASSWORD: howmuch_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment image identity and readiness
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/ci-venv/bin/python" -m unittest discover -s scripts/tests -v

      - name: Run Java and JavaScript tests
        run: bash scripts/test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
            build/reports/javascript-tests.txt
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build Docker image
    outputs:
      image: ${{ steps.image.outputs.image }}
    needs: test
    runs-on: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=ref,event=branch

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Record published image
        if: github.event_name == 'push'
        id: image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in *[!a-z0-9:]*) exit 1 ;; esac
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          repository=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          image="$REGISTRY/$repository@$DIGEST"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Commit: %s\nRun: %s (attempt %s)\nImage: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$image" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, Linux, X64, pve-deploy]
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/howmuch-infra' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_PAT: ${{ env.GHCR_PAT }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_PAT,APP_DIR,APP_IMAGE,DEPLOY_SHA,DEPLOY_RUN_ID,DEPLOY_RUN_ATTEMPT
          script_path: scripts/deploy-readiness.sh
