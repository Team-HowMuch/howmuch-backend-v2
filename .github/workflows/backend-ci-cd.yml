name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/team-howmuch/howmuch-backend-v2

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: howmuch_test
          POSTGRES_USER: howmuch
          POSTGRES_PASSWORD: howmuch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howmuch -d howmuch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/howmuch_test
      DB_USERNAME: howmuch
      DB_PASSWORD: howmuch
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SMS_SENDER: discord
      DISCORD_SMS_WEBHOOK_URL: https://example.invalid
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify Docker image
        if: github.event_name == 'pull_request'
        run: docker build --tag howmuch-backend-v2:ci .

  publish:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/howmuch-backend' }}
      IMAGE_REF: ghcr.io/team-howmuch/howmuch-backend-v2@${{ needs.publish.outputs.digest }}
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            printf 'Host deploy-target\n'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '  Port %s\n' "$SSH_PORT"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking accept-new\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Log in to GHCR on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | ssh deploy-target "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Copy Compose configuration
        run: scp compose.yml "deploy-target:/tmp/howmuch-backend-compose-${GITHUB_SHA}.yml"

      - name: Deploy image
        run: |
          set -euo pipefail
          ssh deploy-target bash -s -- "$APP_DIR" "$IMAGE_REF" "$GITHUB_SHA" <<'EOF'
          set -euo pipefail

          app_dir="$1"
          image_ref="$2"
          release_id="$3"
          incoming_compose="/tmp/howmuch-backend-compose-${release_id}.yml"

          mkdir -p "$app_dir"
          test -w "$app_dir"
          test -f "$app_dir/app.env"
          command -v docker >/dev/null
          docker compose version >/dev/null

          cd "$app_dir"
          if [[ -f compose.yml ]]; then
            cp compose.yml compose.yml.previous
          else
            rm -f compose.yml.previous
          fi
          install -m 0644 "$incoming_compose" compose.yml
          rm -f "$incoming_compose"

          if [[ -f .deploy.env ]]; then
            cp .deploy.env .deploy.env.previous
          else
            rm -f .deploy.env.previous
          fi
          printf 'APP_IMAGE=%s\n' "$image_ref" > .deploy.env.next
          mv .deploy.env.next .deploy.env

          rollback() {
            if [[ -f compose.yml.previous && -f .deploy.env.previous ]]; then
              cp compose.yml.previous compose.yml
              cp .deploy.env.previous .deploy.env
              docker compose --env-file .deploy.env up -d --wait --wait-timeout 120 app || true
            fi
          }

          if ! docker compose --env-file .deploy.env config --quiet; then
            rollback
            exit 1
          fi
          if ! docker compose --env-file .deploy.env pull app; then
            rollback
            exit 1
          fi
          if ! docker compose --env-file .deploy.env up -d --wait --wait-timeout 120 app; then
            rollback
            exit 1
          fi

          docker compose --env-file .deploy.env ps app
          EOF
