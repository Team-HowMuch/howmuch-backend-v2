spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

howmuch:
  group:
    invite:
      base-url: ${GROUP_INVITE_BASE_URL}
  settlement:
    link:
      base-url: ${SETTLEMENT_LINK_BASE_URL}
  auth:
    identity:
      hmac-secret: ${AUTH_IDENTITY_HMAC_SECRET}
    sms:
      sender: ${SMS_SENDER:solapi}

jwt:
  secret: ${JWT_SECRET}
