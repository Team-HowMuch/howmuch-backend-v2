spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

howmuch:
  settlement:
    transfer-link:
      adapter: ${SETTLEMENT_TRANSFER_LINK_ADAPTER:mock}
  auth:
    sms:
      sender: ${SMS_SENDER:discord}
