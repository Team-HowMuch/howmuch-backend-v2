spring:
  application:
    name: howmuch-backend-v2
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 100
howmuch:
  profile:
    image:
      storage-dir: ${PROFILE_IMAGE_STORAGE_DIR:./uploads/profile-images}
  codef:
    base-url: ${CODEF_BASE_URL:https://development.codef.io}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    public-key: ${CODEF_PUBLIC_KEY:}
    connected-id-encryption-key: ${CODEF_CONNECTED_ID_ENCRYPTION_KEY:}
    connect-timeout: ${CODEF_CONNECT_TIMEOUT:5s}
    read-timeout: ${CODEF_READ_TIMEOUT:305s}
  auth:
    identity:
      hmac-secret: ${AUTH_IDENTITY_HMAC_SECRET:local-development-identity-hmac-secret}
    sms:
      otp-ttl: 3m
      challenge-ttl: 30m
      resend-cooldown: 60s
      max-attempts: 5
      sender: ${SMS_SENDER:discord}
      discord:
        webhook-url: ${DISCORD_SMS_WEBHOOK_URL:}
        username: ${DISCORD_SMS_USERNAME:HowMuch SMS Mock}
      solapi:
        api-key: ${SOLAPI_API_KEY:}
        api-secret: ${SOLAPI_API_SECRET:}
        sender: ${SOLAPI_SENDER:}
    pin:
      max-attempts: 5
      lock-duration: 30m
    session:
      single-session-per-user: true
      rotate-request-token: true

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-key-must-be-at-least-32-bytes}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
