spring:
  application:
    name: howmuch-backend-v2
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:8000}
        max.request.size: 262144
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1
      properties:
        allow.auto.create.topics: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      auto-create: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 100
  cache:
    type: caffeine
    cache-names:
      - commonCodeByGroupAndCode
      - commonCodeByGroup
      - commonCodeExistsByGroupAndCode
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
howmuch:
  certificate:
    enabled: ${CERTIFICATE_ENABLED:false}
    detailed-errors-enabled: ${CERTIFICATE_DETAILED_ERRORS_ENABLED:false}
    kms-key-id: ${CERTIFICATE_KMS_KEY_ID:}
    local-wrapping-key: ${CERTIFICATE_LOCAL_WRAPPING_KEY:}
    confirmation-key: ${CERTIFICATE_CONFIRMATION_KEY:}
  messaging:
    kafka:
      enabled: ${KAFKA_ENABLED:false}
      publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
      processing-retry-interval: ${KAFKA_PROCESSING_RETRY_INTERVAL:1s}
      concurrency: ${KAFKA_CONCURRENCY:1}
      notification-delivery-topic: notification.delivery.v1
      notification-delivery-dlt-topic: notification.delivery.v1.dlt
      notification-delivery-group: howmuch-notification-delivery-v1
      notification-consumer-enabled: ${NOTIFICATION_KAFKA_CONSUMER_ENABLED:false}
      recap-published-topic: recap.published.v1
      recap-published-dlt-topic: recap.published.v1.dlt
      recap-published-group: howmuch-recap-notification-v1
      recap-consumer-enabled: ${RECAP_KAFKA_CONSUMER_ENABLED:false}
  analytics:
    amplitude:
      api-key: ${AMPLITUDE_API_KEY:}
      secret-key: ${AMPLITUDE_SECRET_KEY:}
  persistence:
    lock-timeout: ${DB_LOCK_TIMEOUT:500ms}
  group:
    image:
      storage-dir: ${GROUP_IMAGE_STORAGE_DIR:./uploads/group-images}
    invite:
      base-url: ${GROUP_INVITE_BASE_URL:http://localhost:8080/groups/join}
  settlement:
    transfer-link:
      adapter: ${SETTLEMENT_TRANSFER_LINK_ADAPTER:toss}
      mock:
        base-url: ${SETTLEMENT_MOCK_TRANSFER_BASE_URL:https://howmuch-mock-send.vercel.app/send}
    link:
      base-url: ${SETTLEMENT_LINK_BASE_URL:http://localhost:8080/api/v2/settlement-links}
      ttl: ${SETTLEMENT_LINK_TTL:720h}
    participant-context:
      ttl: ${SETTLEMENT_PARTICIPANT_CONTEXT_TTL:30m}
    bank-lookup-budget:
      namespace: ${SETTLEMENT_BANK_LOOKUP_BUDGET_NAMESPACE:default}
    transfer-reconciliation:
      enabled: ${SETTLEMENT_TRANSFER_RECONCILIATION_ENABLED:true}
      poll-interval: ${SETTLEMENT_TRANSFER_RECONCILIATION_POLL_INTERVAL:5s}
      batch-size: ${SETTLEMENT_TRANSFER_RECONCILIATION_BATCH_SIZE:10}
    category-classification:
      enabled: ${SETTLEMENT_CATEGORY_CLASSIFICATION_ENABLED:true}
      poll-interval: ${SETTLEMENT_CATEGORY_CLASSIFICATION_POLL_INTERVAL:5s}
      batch-size: ${SETTLEMENT_CATEGORY_CLASSIFICATION_BATCH_SIZE:10}
    automatic-reminder:
      enabled: ${SETTLEMENT_AUTOMATIC_REMINDER_ENABLED:false}
      poll-interval: ${SETTLEMENT_AUTOMATIC_REMINDER_POLL_INTERVAL:1m}
      batch-size: ${SETTLEMENT_AUTOMATIC_REMINDER_BATCH_SIZE:50}
    notification-outbox:
      enabled: ${SETTLEMENT_NOTIFICATION_OUTBOX_ENABLED:true}
      poll-interval: ${SETTLEMENT_NOTIFICATION_OUTBOX_POLL_INTERVAL:1s}
      initial-delay: ${SETTLEMENT_NOTIFICATION_OUTBOX_INITIAL_DELAY:1s}
      batch-size: ${SETTLEMENT_NOTIFICATION_OUTBOX_BATCH_SIZE:50}
  receipt:
    ocr:
      # 비워 두면 연동이 꺼진다. 테스트·로컬에서 내부 장비를 부르지 않게 한다.
      base-url: ${RECEIPT_OCR_BASE_URL:}
      path: ${RECEIPT_OCR_PATH:/ocr/receipt}
      connect-timeout: ${RECEIPT_OCR_CONNECT_TIMEOUT:3s}
      read-timeout: ${RECEIPT_OCR_READ_TIMEOUT:20s}
  recap:
    generation:
      enabled: ${RECAP_GENERATION_ENABLED:false}
      poll-interval: 30s
    image:
      storage-dir: ${RECAP_IMAGE_STORAGE_DIR:./uploads/recap-images}
  profile:
    image:
      storage-dir: ${PROFILE_IMAGE_STORAGE_DIR:./uploads/profile-images}
  notification:
    delivery-mode: ${NOTIFICATION_DELIVERY_MODE:DIRECT}
    firebase:
      enabled: ${FIREBASE_ENABLED:false}
    apns:
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      private-key-path: ${APNS_PRIVATE_KEY_PATH:}
      environment: ${APNS_ENVIRONMENT:dev}
  codef:
    base-url: ${CODEF_BASE_URL:https://development.codef.io}
    oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}
    client-id: ${CODEF_CLIENT_ID:}
    client-secret: ${CODEF_CLIENT_SECRET:}
    public-key: ${CODEF_PUBLIC_KEY:}
    connected-id-encryption-key: ${CODEF_CONNECTED_ID_ENCRYPTION_KEY:}
    connect-timeout: ${CODEF_CONNECT_TIMEOUT:5s}
    read-timeout: ${CODEF_READ_TIMEOUT:305s}
  auth:
    identity:
      hmac-secret: ${AUTH_IDENTITY_HMAC_SECRET:local-development-identity-hmac-secret}
    sms:
      otp-ttl: 3m
      challenge-ttl: 30m
      resend-cooldown: 60s
      max-attempts: 5
      sender: ${SMS_SENDER:discord}
      discord:
        webhook-url: ${DISCORD_SMS_WEBHOOK_URL:}
        username: ${DISCORD_SMS_USERNAME:HowMuch SMS Mock}
      solapi:
        api-key: ${SOLAPI_API_KEY:}
        api-secret: ${SOLAPI_API_SECRET:}
        sender: ${SOLAPI_SENDER:}
    pin:
      max-attempts: 5
      lock-duration: 30m
    session:
      single-session-per-user: true
      rotate-request-token: true
  treasurer:
    llm:
      provider: ${TREASURER_LLM_PROVIDER:none}
      connect-timeout: ${TREASURER_LLM_CONNECT_TIMEOUT:5s}
      read-timeout: ${TREASURER_LLM_READ_TIMEOUT:20s}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-6-luna}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-flash-latest}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    answer-retention:
      enabled: ${TREASURER_ANSWER_RETENTION_ENABLED:true}
      retention: ${TREASURER_ANSWER_RETENTION:30d}
      poll-interval: ${TREASURER_ANSWER_RETENTION_POLL_INTERVAL:1h}
      initial-delay: ${TREASURER_ANSWER_RETENTION_INITIAL_DELAY:5m}
      batch-size: ${TREASURER_ANSWER_RETENTION_BATCH_SIZE:500}
      max-batches: ${TREASURER_ANSWER_RETENTION_MAX_BATCHES:20}
  observability:
    management:
      allowed-cidr: ${MANAGEMENT_ALLOWED_CIDR:127.0.0.1/32}

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-key-must-be-at-least-32-bytes}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  file:
    name: ${LOG_FILE:${java.io.tmpdir}/howmuch-backend-v2.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz}
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:5GB}
      max-history: ${LOG_MAX_HISTORY:15}
  structured:
    format:
      console: logstash
      file: logstash

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    enable:
      http.server.requests: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    baggage:
      enabled: false
    propagation:
      consume: []
      produce: []
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    enabled: ${OTEL_ENABLED:true}
    tracing:
      sampler: PARENT_BASED_TRACE_ID_RATIO
      export:
        timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:10s}
        max-batch-size: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:512}
        max-queue-size: ${OTEL_BSP_MAX_QUEUE_SIZE:2048}
        schedule-delay: ${OTEL_BSP_SCHEDULE_DELAY:5s}
        otlp:
          transport: HTTP

jdbc:
  includes: QUERY
  datasource-proxy:
    enabled: true
    include-parameter-values: false
    query:
      enable-logging: false
    slow-query:
      enable-logging: false
  resultset-operations:
    enabled: false
