spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/howmuch}
    username: ${DB_USERNAME:howmuch}
    password: ${DB_PASSWORD:howmuch}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: ""

management:
  server:
    address: 127.0.0.1

howmuch:
  settlement:
    transfer-link:
      adapter: ${SETTLEMENT_TRANSFER_LINK_ADAPTER:mock}
